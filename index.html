<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>London Map</title>
<!-- Open connections to the map servers before the script asks for them (OSIRIS does this for its fonts) -->
<link rel="preconnect" href="https://api.maptiler.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; background: #f2f2ef; }
  .maplibregl-popup-content { font: 13px/1.4 system-ui, sans-serif; padding: 8px 12px; }
  #traffic-toggle, #cctv-toggle, #vehicles-toggle, #estimate { position: absolute; top: 10px; left: 10px; z-index: 3; background: #fff; padding: 6px 10px; border-radius: 6px;
    box-shadow: 0 1px 4px #0003; font: 13px system-ui, sans-serif; cursor: pointer; }
  #cctv-toggle { top: 48px; }
  #vehicles-toggle { top: 86px; }
  #estimate { top: auto; bottom: 30px; cursor: default; line-height: 1.5; }

  /* ---- Live camera previews (same look as OSIRIS's CctvPreviews) ---- */
  :root { --cctv: #1a73e8; } /* blue writing and accents; map dots stay green (CCTV_COLOUR) */
  #cctv-tiles { position: absolute; inset: 0; z-index: 2; overflow: hidden; pointer-events: none; }
  .cctv-wrap { position: absolute; left: 0; top: 0; width: 176px; pointer-events: auto; will-change: transform; }
  .cctv-tile { display: block; width: 176px; padding: 0; border: 0; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    text-align: left; cursor: pointer;
    transform-origin: 50% 100%; transition: transform .18s cubic-bezier(.16,1,.3,1), filter .18s ease; }
  .cctv-tile:hover, .cctv-tile:focus-visible { outline: none; transform: translateY(-3px);
    filter: brightness(1.12) drop-shadow(0 0 10px color-mix(in srgb, var(--cctv) 30%, transparent)); }
  .cctv-frame { position: relative; height: 99px; overflow: hidden; background: #fff; }
  .cctv-frame img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; }
  .cctv-frame.loaded img { opacity: 1; }
  .cctv-fx { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 22px rgba(0,0,0,.85); /* scanlines + vignette */
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  .cctv-corner { position: absolute; width: 10px; height: 10px; pointer-events: none; border: 0 solid color-mix(in srgb, var(--cctv) 80%, transparent); }
  .cctv-corner.tl { left: 0; top: 0; border-width: 1px 0 0 1px; } .cctv-corner.tr { right: 0; top: 0; border-width: 1px 1px 0 0; }
  .cctv-corner.bl { left: 0; bottom: 0; border-width: 0 0 1px 1px; } .cctv-corner.br { right: 0; bottom: 0; border-width: 0 1px 1px 0; }
  .cctv-badge { position: absolute; top: 6px; display: flex; align-items: center; gap: 4px; padding: 1px 4px; background: rgba(0,0,0,.7);
    font: 7px/1.4 ui-monospace, monospace; letter-spacing: .18em; color: rgba(255,255,255,.75); pointer-events: none; }
  .cctv-badge.live { left: 6px; } .cctv-badge.open { right: 6px; color: var(--cctv); opacity: 0; transition: opacity .2s; }
  .cctv-tile:hover .cctv-badge.open { opacity: 1; }
  .cctv-badge i { width: 4px; height: 4px; border-radius: 50%; background: #ff3d3d; animation: cctv-pulse 2s ease-in-out infinite; }
  .cctv-linking { position: absolute; inset: 0; overflow: hidden; background: #f1f3f4; display: flex; align-items: center; justify-content: center;
    font: 7px ui-monospace, monospace; letter-spacing: .25em; color: rgba(0,0,0,.35); }
  .cctv-linking::before { content: ""; position: absolute; left: 0; right: 0; height: 32px; animation: scan-line-sweep 1.8s ease-in-out infinite;
    background: linear-gradient(to bottom, transparent, color-mix(in srgb, var(--cctv) 18%, transparent), transparent); }
  .cctv-frame.loaded .cctv-linking { display: none; }
  .cctv-label { display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 6px; box-sizing: border-box; background: #fff; color: var(--cctv);
    font: 8px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; white-space: nowrap; overflow: hidden; }
  .cctv-label i { flex: none; width: 4px; height: 4px; border-radius: 50%; background: var(--cctv); box-shadow: 0 0 5px var(--cctv); }
  .cctv-label span { overflow: hidden; text-overflow: ellipsis; }
  /* Line from tile to its marker; place() sets data-flip so only the marker-side stem shows */
  .cctv-stem { position: absolute; left: 50%; width: 1px; height: 21px; pointer-events: none; }
  .cctv-stem.down { top: 119px; background: linear-gradient(to bottom, color-mix(in srgb, var(--cctv) 70%, transparent), color-mix(in srgb, var(--cctv) 10%, transparent)); }
  .cctv-stem.up { bottom: 119px; background: linear-gradient(to top, color-mix(in srgb, var(--cctv) 70%, transparent), color-mix(in srgb, var(--cctv) 10%, transparent)); }
  [data-flip="above"] .cctv-stem.up, [data-flip="below"] .cctv-stem.down, [data-flip="none"] .cctv-stem { display: none; }
  @keyframes scan-line-sweep { 0% { transform: translateY(-100%); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(400%); opacity: 0; } }
  @keyframes cctv-pulse { 50% { opacity: .3; } }

  /* Full camera viewer (opens on click, 5 s refresh like OSIRIS's CameraViewer) */
  #cctv-viewer { position: absolute; top: 10px; right: 10px; z-index: 4; width: min(480px, calc(100% - 20px)); max-width: 100vw; max-height: 100vh;
    display: flex; flex-direction: column; background: #fff; border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.35); font: 11px ui-monospace, monospace; color: #555; }
  #cctv-viewer[hidden] { display: none; }
  .cv-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; color: var(--cctv); text-transform: uppercase; letter-spacing: .12em;
    cursor: move; touch-action: none; user-select: none; }
  /* Corner grip to resize (works for mouse and touch, unlike CSS resize) */
  .cv-grip { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 50%, color-mix(in srgb, var(--cctv) 70%, transparent) 50% 60%, transparent 60% 70%,
      color-mix(in srgb, var(--cctv) 70%, transparent) 70% 80%, transparent 80%); }
  .cv-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cv-head button { background: none; border: 0; color: #555; font-size: 18px; line-height: 1; cursor: pointer; }
  #cctv-viewer .cctv-frame { height: auto; aspect-ratio: 16 / 9; flex: 1 1 auto; min-height: 0; }
  #cctv-viewer .cctv-frame img { object-fit: contain; } /* whole frame visible at any panel shape */
  .cv-meta { padding: 6px 8px; color: #666; }
  .cv-meta a { color: var(--cctv); }
  @media (prefers-reduced-motion: reduce) { .cctv-tile { transition: none; } .cctv-tile:hover { transform: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="cctv-tiles"></div>
<label id="traffic-toggle"><input type="checkbox"> Traffic</label>
<label id="cctv-toggle"><input type="checkbox"> Live cameras</label>
<label id="vehicles-toggle"><input type="checkbox"> 3D vehicles</label>
<div id="estimate" aria-live="polite">Vehicle estimate: zoom in to 15+</div>
<div id="cctv-viewer" hidden>
  <div class="cv-head"><span id="cv-name"></span><button id="cv-close" aria-label="Close camera">×</button></div>
  <div class="cctv-frame"><img id="cv-img" alt=""><div class="cctv-fx"></div><div class="cctv-badge live"><i></i>LIVE</div>
    <div class="cctv-linking">LINKING</div></div>
  <div class="cv-meta">TfL JamCam · refreshes every 5 s · <a id="cv-src" target="_blank" rel="noopener noreferrer">open image</a></div>
  <div class="cv-grip" aria-label="Resize camera"></div>
</div>
<script>
const MAPTILER_KEY = "Piqlzte12zD4i2H9jha1";
const TOMTOM_KEY = "CPnPmYj0K9TjSsJsQ7cQp3NJ6vjm0c8C";
const SOURCE = "maptiler_planet"; // vector source name inside the streets-v2 style

// Style layers to hide: POIs, transit lines/labels and other clutter.
// Kept: roads, "Road labels", place/area labels, land, water, buildings.
const HIDDEN_LAYERS = [
  "Public", "Sport", "Education", "Tourism", "Culture", "Shopping", "Food", "Transport", "Park", "Healthcare", "Station",
  "Major rail", "Major rail hatching", "Minor rail", "Minor rail hatching", "Railway tunnel", "Railway tunnel hatching",
  "Ferry line", "Ferry", "Cablecar", "Cablecar dash", "Gondola", "Airport", "Airport gate",
  "Oneway", "Housenumber", "Highway junction", "Highway shield", "River labels", "Ocean labels", "Lake labels",
];

const map = new maplibregl.Map({
  container: "map",
  style: `https://api.maptiler.com/maps/streets-v2/style.json?key=${MAPTILER_KEY}`,
  center: [-0.128, 51.507],
  zoom: 14,
  minZoom: 10,
  maxBounds: [[-0.65, 51.24], [0.42, 51.74]], // Greater London plus a margin
  // 2D; pitch and rotation are unlocked only for 3D vehicles at zoom 16+ (see setTilt)
  pitch: 0, maxPitch: 0, dragRotate: false, touchPitch: false,
});
map.touchZoomRotate.disableRotation();
map.keyboard.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");

const busPaint = { "circle-radius": 4, "circle-color": "#d32f2f", "circle-stroke-color": "#fff", "circle-stroke-width": 1.5 };

map.on("load", () => {
  // Declutter: hide everything listed above (plus any US shield variants)
  for (const { id } of map.getStyle().layers)
    if (HIDDEN_LAYERS.includes(id) || id.startsWith("Highway shield")) map.setLayoutProperty(id, "visibility", "none");

  // Buildings: flat 2D footprints from z14, no extrusion
  map.removeLayer("Building 3D");
  map.setLayerZoomRange("Building", 14, 24);
  map.setPaintProperty("Building", "fill-color", "#ddd5c8");
  map.setPaintProperty("Building", "fill-outline-color", "#c6bcac");
  map.setPaintProperty("Building", "fill-opacity", 1);

  // Bus stops from the vector tiles' poi layer
  map.addLayer({
    id: "bus-stops", type: "circle", source: SOURCE, "source-layer": "poi", minzoom: 15,
    filter: ["all", ["==", ["get", "class"], "bus"], ["==", ["get", "subclass"], "bus_stop"]],
    paint: busPaint,
  });

  // Fallback bus stops from Overpass (only filled if the tiles have none in view)
  map.addSource("overpass-bus", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "bus-stops-osm", type: "circle", source: "overpass-bus", minzoom: 15, paint: busPaint });

  for (const layer of ["bus-stops", "bus-stops-osm"]) {
    map.on("click", layer, e => {
      new maplibregl.Popup({ closeButton: false })
        .setLngLat(e.features[0].geometry.coordinates)
        .setText(e.features[0].properties.name || "Bus stop")
        .addTo(map);
    });
    map.on("mouseenter", layer, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", layer, () => map.getCanvas().style.cursor = "");
  }
});

// ---- Live traffic: TomTom flow tiles above roads, below labels ----
let trafficOn = false; // off at start; a hidden layer requests no tiles
function addTraffic() {
  if (map.getLayer("traffic")) map.removeLayer("traffic");
  if (map.getSource("traffic")) map.removeSource("traffic");
  map.addSource("traffic", { type: "raster", tileSize: 256, // t= busts the tile cache on each refresh
    tiles: [`https://api.tomtom.com/traffic/map/4/tile/flow/relative/{z}/{x}/{y}.png?key=${TOMTOM_KEY}&t=${Date.now()}`] });
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  map.addLayer({ id: "traffic", type: "raster", source: "traffic", paint: { "raster-opacity": 0.8 },
    layout: { visibility: trafficOn ? "visible" : "none" } }, firstLabel);
}
map.on("style.load", addTraffic); // fires on first load and after any style change
setInterval(() => { if (trafficOn) addTraffic(); }, 2 * 60 * 1000);
document.querySelector("#traffic-toggle input").addEventListener("change", e => {
  trafficOn = e.target.checked;
  if (map.getLayer("traffic")) map.setLayoutProperty("traffic", "visibility", trafficOn ? "visible" : "none");
});

// ---- Live London cameras (TfL JamCams), shown the way OSIRIS does it ----
// All ~900 cameras are GPU circles. From zoom 13 the 8 cameras nearest the screen centre also get a live
// JPEG preview tile pinned above their marker. Which cameras get tiles is decided only when the map
// settles; during a pan tiles are just moved with a CSS transform, so nothing is rebuilt per frame.
const CCTV_COLOUR = "#00e676";
const TILE = { w: 176, imgH: 99, labelH: 20, gap: 26 }, TILE_H = TILE.imgH + TILE.labelH;
const MIN_ZOOM = 13, MAX_TILES = 8, TILE_REFRESH = 15000, VIEWER_REFRESH = 5000;
const EDGE = 10, EDGE_TOP = 128, EDGE_BOTTOM = 40; // keep tiles clear of the toggles and zoom buttons
let cctvData = { type: "FeatureCollection", features: [] }, cctvOn = false, hoveredCam = "", camerasRequested = false;
const tiles = new Map(); // camera id -> { cam, el, timers }
const tilesEl = document.getElementById("cctv-tiles");
const freshen = url => `${url}${url.includes("?") ? "&" : "?"}_t=${Date.now()}`; // snapshot URL returns a new frame each time

// One request for every camera, made only when the layer is first switched on (as OSIRIS does).
// TfL allows browser calls without a key and the response is HTTP-cached for 12 h.
const loadCameras = () => camerasRequested || (camerasRequested = true, fetch("https://api.tfl.gov.uk/Place/Type/JamCam")
  .then(r => { if (!r.ok) throw new Error(`TfL HTTP ${r.status}`); return r.json(); })
  .then(list => {
    cctvData.features = list.filter(c => c.lat && c.lon).map(c => {
      const img = c.additionalProperties?.find(p => p.key === "imageUrl")?.value
        || `https://s3-eu-west-1.amazonaws.com/jamcams.tfl.gov.uk/${c.id.replace("JamCams_", "")}.jpg`;
      return { type: "Feature", geometry: { type: "Point", coordinates: [c.lon, c.lat] },
        properties: { id: c.id, name: c.commonName || "London JamCam", feed_url: img } };
    });
    map.getSource("cctv")?.setData(cctvData);
  })
  .catch(err => { camerasRequested = false; console.warn("Camera list failed:", err); })); // retry on next toggle

map.on("style.load", () => {
  map.addSource("cctv", { type: "geojson", data: cctvData });
  const vis = { visibility: cctvOn ? "visible" : "none" };
  map.addLayer({ id: "cctv-glow", type: "circle", source: "cctv", layout: vis, paint: {
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 4, 5, 6, 10, 10, 14, 14],
    "circle-color": "#000", "circle-opacity": 0.35, "circle-blur": 1 } });
  map.addLayer({ id: "cctv-dots", type: "circle", source: "cctv", layout: vis, paint: {
    "circle-radius": ["interpolate", ["linear"], ["zoom"], 1, 2, 5, 3.5, 10, 5.5, 14, 8],
    "circle-color": CCTV_COLOUR, "circle-opacity": 0.9, "circle-stroke-width": 2, "circle-stroke-color": "#000", "circle-stroke-opacity": 0.9 } });
  // Name label only for the camera under the cursor (filter is updated on hover)
  map.addLayer({ id: "cctv-label", type: "symbol", source: "cctv", filter: ["==", ["get", "id"], hoveredCam], layout: { ...vis,
    "text-field": ["get", "name"], "text-size": 11, "text-offset": [0, 1.5], "text-max-width": 12, "text-allow-overlap": true,
    "text-font": map.getLayoutProperty("Road labels", "text-font") }, // a font this style's glyph server has
    paint: { "text-color": CCTV_COLOUR, "text-halo-color": "#000", "text-halo-width": 1.5, "text-opacity": 0.8 } });
});

// Tile above its marker, or below when there's no room; clamped inside the view (then it has no connector)
function layoutTile(pt) {
  const { clientWidth: W, clientHeight: H } = map.getCanvas();
  const above = pt.y - TILE_H - TILE.gap, flipped = above < EDGE_TOP;
  const wantX = pt.x - TILE.w / 2, wantY = flipped ? pt.y + TILE.gap : above;
  const x = Math.min(Math.max(wantX, EDGE), Math.max(EDGE, W - TILE.w - EDGE));
  const y = Math.min(Math.max(wantY, EDGE_TOP), Math.max(EDGE_TOP, H - TILE_H - EDGE_BOTTOM));
  return { x, y, flipped, anchored: Math.abs(x - wantX) < 1 && Math.abs(y - wantY) < 1 };
}
const tilesOverlap = (a, b) => Math.abs(a.x - b.x) < TILE.w + 8 && Math.abs(a.y - b.y) < TILE_H + TILE.gap;

function makeTile(cam) {
  const el = document.createElement("div");
  el.className = "cctv-wrap";
  el.dataset.flip = "above";
  el.innerHTML = `<button class="cctv-tile"><div class="cctv-frame"><img width="176" height="99" draggable="false" alt="">
    <div class="cctv-fx"></div><span class="cctv-corner tl"></span><span class="cctv-corner tr"></span><span class="cctv-corner bl"></span>
    <span class="cctv-corner br"></span><div class="cctv-badge live"><i></i>LIVE</div><div class="cctv-badge open">⤢ OPEN</div>
    <div class="cctv-linking">LINKING</div></div><div class="cctv-label"><i></i><span></span></div></button>
    <span class="cctv-stem down"></span><span class="cctv-stem up"></span>`;
  const img = el.querySelector("img"), frame = el.querySelector(".cctv-frame");
  el.querySelector(".cctv-label span").textContent = img.alt = el.querySelector("button").title = cam.name;
  img.onload = () => frame.classList.add("loaded");
  img.onerror = () => { el.style.display = "none"; }; // a dead feed is worse than no tile
  img.src = freshen(cam.feed_url);
  el.querySelector("button").onclick = () => openViewer(cam);
  // Staggered refresh so the tiles don't all hit TfL on the same tick
  const t = { interval: null };
  t.first = setTimeout(() => {
    img.src = freshen(cam.feed_url);
    t.interval = setInterval(() => { img.src = freshen(cam.feed_url); }, TILE_REFRESH);
  }, TILE_REFRESH + Math.random() * 2000);
  return { cam, el, timers: t };
}
function dropTile(id) {
  const t = tiles.get(id);
  clearTimeout(t.timers.first); clearInterval(t.timers.interval);
  t.el.remove();
  tiles.delete(id);
}

// Pick which cameras get a tile. Runs only when the map settles.
function recomputeTiles() {
  let picked = [];
  if (cctvOn && map.getZoom() >= MIN_ZOOM && map.getLayer("cctv-dots")) {
    const { clientWidth: W, clientHeight: H } = map.getCanvas(), seen = new Set(), candidates = [];
    for (const f of map.queryRenderedFeatures({ layers: ["cctv-dots"] })) {
      const p = f.properties;
      if (seen.has(p.id)) continue;
      seen.add(p.id);
      const coords = f.geometry.coordinates, pt = map.project(coords);
      candidates.push({ cam: { ...p, lng: coords[0], lat: coords[1] }, box: layoutTile(pt), d: (pt.x - W / 2) ** 2 + (pt.y - H / 2) ** 2 });
    }
    // Nearest the centre first; skip any tile that would land on one already taken
    candidates.sort((a, b) => a.d - b.d);
    for (const c of candidates) {
      if (picked.length >= MAX_TILES) break;
      if (!picked.some(p => tilesOverlap(p.box, c.box))) picked.push(c);
    }
  }
  const keep = new Set(picked.map(p => p.cam.id));
  for (const id of [...tiles.keys()]) if (!keep.has(id)) dropTile(id);
  for (const { cam } of picked) if (!tiles.has(cam.id)) { const t = makeTile(cam); tiles.set(cam.id, t); tilesEl.append(t.el); }
  placeTiles();
}

// Keep tiles glued to their markers on every frame of a pan, without rebuilding anything
function placeTiles() {
  for (const { cam, el } of tiles.values()) {
    const box = layoutTile(map.project([cam.lng, cam.lat]));
    el.dataset.flip = !box.anchored ? "none" : box.flipped ? "below" : "above";
    el.style.transform = `translate3d(${Math.round(box.x)}px, ${Math.round(box.y)}px, 0)`;
  }
}
map.on("move", placeTiles);
// moveend can fire before the view's data is parsed, so idle and the camera source loading also re-check
for (const ev of ["moveend", "zoomend", "idle"]) map.on(ev, recomputeTiles);
map.on("sourcedata", e => { if (e.sourceId === "cctv" && e.isSourceLoaded) recomputeTiles(); });

// Full viewer: bigger frame, refreshed every 5 s while open
const viewer = document.getElementById("cctv-viewer"), cvImg = document.getElementById("cv-img");
let viewerTimer;
cvImg.onload = () => cvImg.parentElement.classList.add("loaded");
function openViewer(cam) {
  clearInterval(viewerTimer);
  cvImg.parentElement.classList.remove("loaded");
  document.getElementById("cv-name").textContent = cvImg.alt = cam.name;
  document.getElementById("cv-src").href = cam.feed_url;
  cvImg.src = freshen(cam.feed_url);
  viewerTimer = setInterval(() => { cvImg.src = freshen(cam.feed_url); }, VIEWER_REFRESH);
  viewer.hidden = false;
}
document.getElementById("cv-close").onclick = () => { viewer.hidden = true; clearInterval(viewerTimer); };
map.on("click", "cctv-dots", e => {
  const f = e.features[0];
  openViewer({ ...f.properties, lng: f.geometry.coordinates[0], lat: f.geometry.coordinates[1] });
});
const showName = id => {
  if (id === hoveredCam) return;
  hoveredCam = id;
  map.setFilter("cctv-label", ["==", ["get", "id"], id]);
};
// Hover checks capped at 10/s and skipped while the map moves (OSIRIS keeps this work out of gestures)
let lastHover = 0;
map.on("mousemove", e => {
  if (!cctvOn || map.isMoving() || performance.now() - lastHover < 100) return;
  lastHover = performance.now();
  const f = map.queryRenderedFeatures(e.point, { layers: ["cctv-dots"] })[0];
  if (f) map.getCanvas().style.cursor = "pointer";
  else if (hoveredCam) map.getCanvas().style.cursor = ""; // only clear a cursor we set
  showName(f ? f.properties.id : "");
});

// Viewer: drag by its title bar, resize from the corner grip (pointer events cover mouse and touch)
function onDrag(handle, apply) {
  handle.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return; // let the close button click
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    const start = viewer.getBoundingClientRect(), x0 = e.clientX, y0 = e.clientY;
    const move = ev => apply(start, ev.clientX - x0, ev.clientY - y0);
    handle.addEventListener("pointermove", move);
    handle.addEventListener("lostpointercapture", () => handle.removeEventListener("pointermove", move), { once: true });
  });
}
onDrag(viewer.querySelector(".cv-head"), (r, dx, dy) => {
  viewer.style.right = "auto"; // switch from right- to left-anchored once moved
  viewer.style.left = `${Math.min(Math.max(0, r.left + dx), innerWidth - 80)}px`; // keep the title bar reachable
  viewer.style.top = `${Math.min(Math.max(0, r.top + dy), innerHeight - 40)}px`;
});
onDrag(viewer.querySelector(".cv-grip"), (r, dx, dy) => {
  viewer.style.right = "auto"; // grow from the top-left corner, towards the cursor
  viewer.style.left = `${r.left}px`;
  viewer.style.width = `${Math.max(280, r.width + dx)}px`;
  viewer.style.height = `${Math.max(200, r.height + dy)}px`;
});

document.querySelector("#cctv-toggle input").addEventListener("change", e => {
  cctvOn = e.target.checked;
  if (cctvOn) loadCameras();
  for (const id of ["cctv-glow", "cctv-dots", "cctv-label"]) map.setLayoutProperty(id, "visibility", cctvOn ? "visible" : "none");
  recomputeTiles();
});

// ---- Estimated vehicles: TomTom speed ratio -> Greenshields density, cross-checked with the WebTRIS model ----
const LANES = { motorway: 3, trunk: 3, primary: 2, secondary: 1, tertiary: 1, minor: 1 }; // road classes we count
const MAJOR = ["motorway", "trunk", "primary", "secondary"];
const MAX_PER_MIN = 9, MAX_PER_DAY = 2000, CACHE_MS = 3 * 60 * 1000, NEAR_M = 300, MAX_VEHICLES = 300, FALLBACK_KMH = 32; // 20 mph
const flowCache = new Map(), callTimes = [], calls = { day: "", n: 0 };
const estimateEl = document.getElementById("estimate");
let flowTable = null, vehiclesOn = false, realBuses = null, roads = [], refreshId = 0, refreshTimer;
fetch("flow_table.json").then(r => r.ok ? r.json() : null).then(t => { flowTable = t; refreshEstimate(); }).catch(() => {});

// Flat-earth metres between [lng, lat] points; fine at street scale
const metres = (a, b) => Math.hypot((b[0] - a[0]) * 111320 * Math.cos(a[1] * Math.PI / 180), (b[1] - a[1]) * 110540);

// TomTom Flow Segment Data at one point: cached ~100 m / 3 min, max 9 calls a minute and 2,000 a day
function flowAt(lat, lon) {
  const key = `${lat.toFixed(3)},${lon.toFixed(3)}`, hit = flowCache.get(key), now = Date.now();
  if (hit && now - hit.at < CACHE_MS) return Promise.resolve(hit);
  while (callTimes.length && now - callTimes[0] > 60000) callTimes.shift();
  const day = new Date().toISOString().slice(0, 10);
  if (calls.day !== day) { calls.day = day; try { calls.n = +localStorage.getItem(`tomtom-flow-${day}`) || 0; } catch { calls.n = 0; } }
  if (callTimes.length >= MAX_PER_MIN || calls.n >= MAX_PER_DAY) return Promise.resolve(hit || null); // stale beats nothing
  callTimes.push(now);
  calls.n++;
  try { localStorage.setItem(`tomtom-flow-${day}`, calls.n); } catch {}
  return fetch(`https://api.tomtom.com/traffic/services/4/flowSegmentData/absolute/10/json?point=${lat},${lon}&key=${TOMTOM_KEY}`)
    .then(r => { if (!r.ok) throw new Error(`TomTom HTTP ${r.status}`); return r.json(); })
    .then(({ flowSegmentData: d }) => {
      const f = { at: Date.now(), ratio: Math.min(1, d.currentSpeed / d.freeFlowSpeed), kmh: d.currentSpeed };
      flowCache.set(key, f);
      return f;
    })
    .catch(err => { console.warn("TomTom flow failed:", err); return hit || null; });
}

// Rendered road lines cut to the runs of vertices inside the view
function visibleRoads() {
  const layers = map.getStyle().layers.filter(l => l["source-layer"] === "transportation" && l.type === "line").map(l => l.id);
  const b = map.getBounds(), seen = new Set(), out = [];
  for (const f of map.queryRenderedFeatures({ layers })) {
    const cls = f.properties.class, lanes = LANES[cls], g = f.geometry;
    if (!lanes) continue;
    for (const line of g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : []) {
      const key = cls + line[0] + line.at(-1); // casing and fill layers return the same line twice
      if (seen.has(key)) continue;
      seen.add(key);
      let run = [];
      for (const p of [...line, null]) {
        if (p && b.contains(p)) { run.push(p); continue; }
        if (run.length > 1) out.push({ cls, lanes, line: run, m: run.slice(1).reduce((s, q, i) => s + metres(run[i], q), 0) });
        run = [];
      }
    }
  }
  return out;
}

const refreshSoon = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refreshEstimate, 400); };
map.on("load", refreshSoon);
map.on("moveend", refreshSoon);

async function refreshEstimate(tries = 0) {
  const id = ++refreshId;
  if (map.getZoom() < 15 || !map.getLayer("vehicles")) { // the layer exists once the style has loaded
    estimateEl.textContent = "Vehicle estimate: zoom in to 15+";
    roads = [];
    return spawnVehicles();
  }
  if (!map.areTilesLoaded() && tries < 10) return void (refreshTimer = setTimeout(() => refreshEstimate(tries + 1), 300));
  const view = visibleRoads(), c = map.getCenter(), pts = [[c.lng, c.lat]];
  // View centre plus up to 8 points spread along the longest major roads
  for (const r of view.filter(r => MAJOR.includes(r.cls)).sort((a, b) => b.m - a.m)) {
    if (pts.length >= 9) break;
    const p = r.line[r.line.length >> 1];
    if (pts.every(q => metres(p, q) > NEAR_M)) pts.push(p);
  }
  const samples = (await Promise.all(pts.map(p => flowAt(p[1], p[0]).then(f => f && { ...f, p })))).filter(Boolean);
  if (id !== refreshId) return; // the view moved on while we waited
  if (!samples.length) { estimateEl.textContent = "Vehicle estimate: no live speed data (TomTom limit reached?)"; roads = []; return spawnVehicles(); }

  const avg = samples.reduce((s, x) => s + x.ratio, 0) / samples.length, avgKmh = samples.reduce((s, x) => s + x.kmh, 0) / samples.length;
  const now = new Date(), day = (now.getDay() + 6) % 7, hour = now.getHours(); // table days are Mon=0
  const predictedFlow = r => flowTable?.table[day][hour][Math.min(9, Math.max(0, Math.round(r * 10) - 1))];
  let total = 0;
  for (const r of view) {
    // Nearest sample within 300 m of the road sets its speed; otherwise the view average
    let best = null, bestD = NEAR_M;
    for (const s of samples) for (const p of r.line) { const d = metres(p, s.p); if (d < bestD) { bestD = d; best = s; } }
    r.ratio = best ? best.ratio : avg;
    r.kmh = best ? best.kmh : avgKmh;
    let k = 120 * (1 - r.ratio); // Greenshields: veh per lane per km
    const q = predictedFlow(r.ratio);
    if (q != null) { // model density = flow / speed; trust the lower one when they disagree by > 2x
      const kModel = q / Math.max(r.kmh, 5);
      if (Math.max(k, kModel) > 2 * Math.min(k, kModel)) k = Math.min(k, kModel);
    }
    r.vehicles = k * r.lanes * r.m / 1000;
    total += r.vehicles;
  }
  roads = view;
  const flow = predictedFlow(avg);
  estimateEl.innerHTML = `Estimated vehicles in view: <b>${Math.round(total)}</b><br>`
    + `Avg speed ratio (estimated): ${avg.toFixed(2)} from ${samples.length} TomTom point${samples.length > 1 ? "s" : ""}<br>`
    + `Predicted flow (estimated): ${flow != null ? Math.round(flow) + " veh/h/lane" : "n/a"}<br>`
    + `Model MAE: ${flowTable ? flowTable.metrics.mae + " veh/h" : "n/a (run train.py)"} · TomTom calls today: ${calls.n}/${MAX_PER_DAY}`;
  spawnVehicles();
}

// ---- 3D vehicles: two InstancedMeshes (cars, buses) in a MapLibre custom layer, zoom 16+ only ----
const CAR_COLOURS = [0xf5f5f5, 0x263238, 0x90a4ae, 0x1565c0, 0x2e7d32, 0xfbc02d].map(c => new THREE.Color(c));
const dummy = new THREE.Object3D();
let vehicles = [], origin, scale, lastFrame = 0, tilted = false;

// Local metres from the spawn origin: x east, y north
function toLocal(p) {
  const m = maplibregl.MercatorCoordinate.fromLngLat(p);
  return [(m.x - origin.x) / scale, (origin.y - m.y) / scale];
}

function spawnVehicles() {
  vehicles = [];
  if (vehiclesOn && map.getZoom() >= 16 && (roads.length || realBuses)) {
    origin = maplibregl.MercatorCoordinate.fromLngLat(map.getCenter());
    scale = origin.meterInMercatorCoordinateUnits();
    const f = Math.min(1, MAX_VEHICLES / roads.reduce((s, r) => s + r.vehicles, 0));
    for (const r of roads) {
      const want = r.vehicles * f, n = Math.floor(want) + (Math.random() < want % 1); // random rounding keeps the total right
      const pts = r.line.map(toLocal), cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const len = cum.at(-1);
      if (len < 5) continue;
      for (let i = 0; i < n && vehicles.length < MAX_VEHICLES; i++) vehicles.push({
        pts, cum, len, s: Math.random() * len, dir: Math.random() < 0.5 ? 1 : -1, v: (r.kmh || FALLBACK_KMH) / 3.6,
        lane: 1.75 + 3.5 * Math.floor(Math.random() * r.lanes), // metres left of travel, as UK traffic drives
        bus: !realBuses && (r.cls === "primary" || r.cls === "secondary") && Math.random() < 0.05,
        colour: CAR_COLOURS[Math.floor(Math.random() * CAR_COLOURS.length)],
      });
    }
  }
  map.triggerRepaint();
}

// Real buses (e.g. the teammate's BODS feed) replace the simulated ones: list of { lng, lat, bearing }, or null
function renderBuses(list) {
  realBuses = list;
  spawnVehicles();
}

function stepVehicles(cars, buses) {
  const now = performance.now(), dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;
  let nc = 0, nb = 0;
  for (const v of vehicles) {
    v.s = (v.s + v.dir * v.v * dt + v.len) % v.len; // loop along the line
    let i = 1;
    while (v.cum[i] < v.s) i++;
    const a = v.pts[i - 1], b = v.pts[i], seg = v.cum[i] - v.cum[i - 1] || 1, t = (v.s - v.cum[i - 1]) / seg;
    const dx = (b[0] - a[0]) / seg * v.dir, dy = (b[1] - a[1]) / seg * v.dir;
    dummy.position.set(a[0] + (b[0] - a[0]) * t - dy * v.lane, a[1] + (b[1] - a[1]) * t + dx * v.lane, 0);
    dummy.rotation.set(0, 0, Math.atan2(dy, dx));
    dummy.updateMatrix();
    if (v.bus) buses.setMatrixAt(nb++, dummy.matrix);
    else { cars.setMatrixAt(nc, dummy.matrix); cars.setColorAt(nc++, v.colour); }
  }
  if (origin) for (const b of realBuses || []) {
    if (nb >= MAX_VEHICLES || !vehiclesOn || map.getZoom() < 16) break;
    const [x, y] = toLocal([b.lng, b.lat]);
    dummy.position.set(x, y, 0);
    dummy.rotation.set(0, 0, (90 - (b.bearing || 0)) * Math.PI / 180); // compass bearing -> angle from east
    dummy.updateMatrix();
    buses.setMatrixAt(nb++, dummy.matrix);
  }
  cars.count = nc;
  buses.count = nb;
  cars.instanceMatrix.needsUpdate = buses.instanceMatrix.needsUpdate = true;
  if (cars.instanceColor) cars.instanceColor.needsUpdate = true;
}

const vehicleLayer = {
  id: "vehicles", type: "custom", renderingMode: "3d",
  onAdd(map, gl) {
    this.camera = new THREE.Camera();
    this.scene = new THREE.Scene();
    this.scene.add(new THREE.AmbientLight(0xffffff, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(0.5, -1, 2);
    this.scene.add(sun);
    // Boxes sit on the road (z up); DoubleSide because the y flip below reverses face winding
    const mesh = (len, w, h, colour) => {
      const m = new THREE.InstancedMesh(new THREE.BoxGeometry(len, w, h).translate(0, 0, h / 2),
        new THREE.MeshLambertMaterial({ color: colour, side: THREE.DoubleSide }), MAX_VEHICLES);
      m.count = 0;
      m.frustumCulled = false; // instances are spread far from the geometry's own bounds
      this.scene.add(m);
      return m;
    };
    this.cars = mesh(4.5, 1.8, 1.5, 0xffffff);
    this.buses = mesh(12, 2.5, 3.2, 0xd32f2f);
    this.renderer = new THREE.WebGLRenderer({ canvas: map.getCanvas(), context: gl, antialias: true });
    this.renderer.autoClear = false;
  },
  render(gl, matrix) {
    if (!origin) return;
    stepVehicles(this.cars, this.buses);
    this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix)
      .multiply(new THREE.Matrix4().makeTranslation(origin.x, origin.y, origin.z).scale(new THREE.Vector3(scale, -scale, scale)));
    this.renderer.resetState();
    this.renderer.render(this.scene, this.camera);
    if (vehicles.length) map.triggerRepaint(); // keep animating only while there is something to move
  },
};
map.on("style.load", () => map.addLayer(vehicleLayer, map.getStyle().layers.find(l => l.type === "symbol")?.id));

// Pitch (up to 60) and rotation only with 3D vehicles on at zoom 16+; plain 2D otherwise
function setTilt() {
  const on = vehiclesOn && map.getZoom() >= 16;
  if (on === tilted) return;
  tilted = on;
  map.setMaxPitch(on ? 60 : 0);
  if (on) { map.dragRotate.enable(); map.touchPitch.enable(); map.touchZoomRotate.enableRotation(); map.keyboard.enableRotation(); }
  else { map.dragRotate.disable(); map.touchPitch.disable(); map.touchZoomRotate.disableRotation(); map.keyboard.disableRotation(); map.setBearing(0); }
}
map.on("zoomend", setTilt);
document.querySelector("#vehicles-toggle input").addEventListener("change", e => {
  vehiclesOn = e.target.checked;
  setTilt();
  spawnVehicles();
});

// ---- Overpass fallback: one query per viewport, cached ----
const fetchedViews = new Set(), osmStops = new Map();

map.on("idle", async () => {
  if (map.getZoom() < 15 || !map.getLayer("bus-stops")) return;
  if (map.queryRenderedFeatures({ layers: ["bus-stops"] }).length) return; // tiles have stops: no fallback needed

  const b = map.getBounds(), r = v => v.toFixed(3);
  const key = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map(r).join(",");
  if (fetchedViews.has(key)) return;
  fetchedViews.add(key);

  try {
    const query = `[out:json][timeout:25];node[highway=bus_stop](${key});out;`;
    const res = await fetch("https://overpass-api.de/api/interpreter", { method: "POST", body: "data=" + encodeURIComponent(query) });
    if (!res.ok) throw new Error(`Overpass HTTP ${res.status}`);
    for (const n of (await res.json()).elements)
      osmStops.set(n.id, { type: "Feature", geometry: { type: "Point", coordinates: [n.lon, n.lat] }, properties: { name: n.tags?.name } });
    map.getSource("overpass-bus").setData({ type: "FeatureCollection", features: [...osmStops.values()] });
  } catch (err) {
    fetchedViews.delete(key); // allow a retry next time this view settles
    console.warn("Bus stop fallback failed:", err);
  }
});
</script>
</body>
</html>
